name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Repository secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare pinned CI tools
        id: setup
        run: |
          for tool in gitleaks actionlint shellcheck; do
            bash scripts/run-setup.sh "$tool" bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh "$tool" --install-dir "$RUNNER_TEMP/ci-tools"
          done
      - name: Retain scanner setup failure evidence
        id: setup_evidence
        if: ${{ failure() && steps.setup.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-setup-${{ github.run_attempt }}
          path: target/setup-evidence/*/*
          if-no-files-found: error
          retention-days: 7
      - name: Report scanner setup evidence retention
        if: ${{ always() && steps.setup.outcome == 'failure' }}
        env:
          ARTIFACT_URL: ${{ steps.setup_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup_evidence.outcome }}
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf 'Setup failure evidence: %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Setup evidence unavailable; upload outcome: %s. Inspect setup logs for missing evidence.\n' "$UPLOAD_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan full history once
        run: '"$RUNNER_TEMP/ci-tools/gitleaks" git --redact=100 --no-banner --no-color --log-level error'
      - name: Check workflow and shell callers
        run: |
          "$RUNNER_TEMP/ci-tools/actionlint" .github/workflows/ci.yml
          "$RUNNER_TEMP/ci-tools/shellcheck" scripts/*.sh scripts/tests/*.sh
  qualify:
    name: Qualify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare compiler
        id: compiler
        run: bash scripts/run-setup.sh compiler bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
      - name: Report compiler selection
        env:
          RUSTUP_AUTO_INSTALL: "0"
        run: |
          rustc --version --verbose
          rustup component list --installed
          rustup target list --installed
      - name: Prepare repository tools and fixtures
        id: setup
        run: |
          bash scripts/run-setup.sh repository-tools make install-tools
          bash scripts/run-setup.sh tools-check make tools-check
          bash scripts/run-setup.sh qualification make qualification-setup
      - name: Retain setup failure evidence
        id: setup_evidence
        if: ${{ failure() && (steps.compiler.outcome == 'failure' || steps.setup.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: setup-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/setup-evidence/*/*
          if-no-files-found: error
          retention-days: 7
      - name: Report setup evidence retention
        if: ${{ always() && (steps.compiler.outcome == 'failure' || steps.setup.outcome == 'failure') }}
        env:
          ARTIFACT_URL: ${{ steps.setup_evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.setup_evidence.outcome }}
        run: |
          if [[ -n "$ARTIFACT_URL" ]]; then
            printf 'Setup failure evidence: %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Setup evidence unavailable; upload outcome: %s. Inspect setup logs for missing evidence.\n' "$UPLOAD_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Qualify product and installed behavior
        run: make ci
