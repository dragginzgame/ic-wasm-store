[workspace]
members = ["crates/ic-wasm-store", "crates/ic-wasm-store-protocol"]
exclude = ["qualification", "target"]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.100.0"
publish = ["crates-io"]
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-wasm-store"

[workspace.dependencies]
# Production
ic-platform-protocol = { version = "0.3.2", default-features = false }
ic-platform-runtime = { version = "0.23.21", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
serde_bytes = "0.11.19"

# Production and tests
ic-storage = "0.78.0"
ic-wasm-store-protocol = { version = "0.5.1", path = "crates/ic-wasm-store-protocol" }
ic-wire = { version = "0.26.0", default-features = false }
serde = "1.0.229"
sha2 = "0.11.1"

# Tests and tooling
toko-tooling = "=0.45.21"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
