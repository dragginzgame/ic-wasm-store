[package]
name = "ic-wasm-store-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
description = "Passive Rust types and bounded IC Wire messages for the Internet Computer Wasm Store"
documentation = "https://docs.rs/ic-wasm-store-protocol"
keywords = ["internet-computer", "wasm", "canister", "protocol", "ic-wire"]
categories = ["wasm", "encoding"]

[package.metadata.cargo-machete]
# Serde names its byte adapter inside string-valued field attributes.
ignored = ["serde_bytes", "toko-tooling"]

[features]
wire-schema = ["ic-wire/derive"]

[dependencies]
ic-wire.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
