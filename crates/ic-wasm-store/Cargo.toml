[package]
name = "ic-wasm-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "README.md"
description = "Internet Computer canister for immutable Wasm storage, resumable uploads and exact restoration"
documentation = "https://docs.rs/ic-wasm-store"
keywords = ["internet-computer", "wasm", "canister", "storage", "uploads"]
categories = ["wasm"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
maintenance-candidate = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-protocol = { workspace = true, features = ["management-chunks"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros"] }
ic-platform-types.workspace = true

[dependencies]
ic-storage.workspace = true
ic-wasm-store-protocol.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
